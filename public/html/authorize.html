<!doctype html>
<html lang=en>

<head>
    <meta charset=utf-8>
    <title>Authorize</title>
</head>

<body>
    <button type=button>Click to authorize</button>
    <script src="../js/constants.js"></script>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script>
        var t = window.TrelloPowerUp.iframe({
            appKey: KEY,
            appName: POWERUP_NAME
        });

        const authUrl =
            "https://trello.com/1/authorize?expiration=never" +
            `&name=Agile Utils&author=Shaked Aharon&scope=read,write,account&key=${KEY}&callback_method=fragment` +
            "&return_url=https://shaked-aharon.github.io/Card-Tag-Trello-PowerUp/authorize.html";

        t.render(function () {
            document.querySelector('button').addEventListener('click', function () {
                t.getRestApi()
                    .authorize(authUrl)
                    .then(function (t) {
                        alert('Success!');
                    }).catch(TrelloPowerUp.restApiError.AuthDeniedError, function () {
                        alert('Cancelled!');
                    });
            }, false);
        });
    </script>
</body>

</html>
