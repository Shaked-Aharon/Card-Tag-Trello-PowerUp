<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .color-option {
      width: 30px;
      height: 30px;
      display: inline-block;
      cursor: pointer;
      margin: 5px;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <div id="color-options">
    <div class="color-option" style="background-color: #D4EDDA;" data-color="#D4EDDA"></div>
    <div class="color-option" style="background-color: #FFF3CD;" data-color="#FFF3CD"></div>
    <div class="color-option" style="background-color: #F8D7DA;" data-color="#F8D7DA"></div>
  </div>
  <script>
    var t = window.TrelloPowerUp.iframe({
      appKey: KEY,
      appName: POWERUP_NAME
    });
    function handleColorSelected(el) {
      var color = el.getAttribute('data-color');
      t.closePopup().then(function () {
        t.set('card', 'shared', 'backgroundColor', color);
      });
    }
    t.render(function () {
      document
        .querySelectorAll('.color-option')
        .forEach(function (el) {
          el.addEventListener('click', () => handleColorSelected(el));
        });
    });
  </script>
</body>

</html>
