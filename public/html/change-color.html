<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .color-option {
      width: 30px;
      height: 30px;
      display: inline-block;
      cursor: pointer;
      margin: 5px;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <script src="../js/constants.js"></script>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <div id="color-options">
    <div class="color-option" style="background-color: #D4EDDA;" data-color="#D4EDDA"></div>
    <div class="color-option" style="background-color: #FFF3CD;" data-color="#FFF3CD"></div>
    <div class="color-option" style="background-color: #F8D7DA;" data-color="#F8D7DA"></div>
  </div>
  <script>
    var t = window.TrelloPowerUp.iframe({
      appKey: KEY,
      appName: POWERUP_NAME
    });
    function handleColorSelected(el) {
      var color = el.getAttribute('data-color');
      t.closePopup().then(function () {
        t.set('card', 'shared', 'backgroundColor', color);
      });
    }

    async function handleColorSelected2(el) {
      try {
        // Get the card ID
        const color = el.getAttribute('data-color');

        const card = await t.card('id');

        // Get authorized REST API client
        const restApi = await t.getRestApi();

        // Update the card's cover
        await restApi.put(`/cards/${card.id}`, {
          cover: {
            color,
            brightness: 'dark',
            size: 'full'
          }
        });
      } catch (error) {
        console.error('Failed to update card color:', error);
      }
    }

    t.render(function () {
      document
        .querySelectorAll('.color-option')
        .forEach(function (el) {
          el.addEventListener('click', () => handleColorSelected2(el));
        });
    });
  </script>
</body>

</html>
